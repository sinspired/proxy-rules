    # BiliBili upos视频服务器（腾讯云）
    +.upos-sz-mirrorcos.bilivideo.com: https://doh.pub/dns-query
    +.upos-sz-mirrorcos?.bilivideo.com: https://doh.pub/dns-query
    +.upos-sz-mirrorcos??.bilivideo.com: https://doh.pub/dns-query
    # BiliBili upos视频服务器（百度云）
