# update: 2026-09-02 23:36:13
# repo: https://github.com/sinspired/subs-check-pro 内置规则

log-level: error # 日志等级 silent/error/warning/info/debug
port: 7890 # HTTP(S) 代理服务器端口
socks-port: 7891 # SOCKS5 代理端口
mixed-port: 10801 # HTTP(S) 和 SOCKS 代理混合端口
allow-lan: true # 允许局域网连接
authentication: # http,socks 入口的验证用户名，密码
  - 'sinspired:sinspired'
skip-auth-prefixes: # 设置跳过验证的 IP 段
  - 127.0.0.1/8
  - ::1/128

#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict
mode: rule

#自定义 geodata url
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@latest/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@latest/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@latest/geoip.metadb'
geo-auto-update: false # 是否自动更新 geodata
geo-update-interval: 72 # 更新间隔，单位：小时

ipv6: true # 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
unified-delay: true # 开启统一延迟时，会计算 RTT，以消除连接握手等带来的不同类型节点的延迟差异
tcp-concurrent: true # TCP 并发

hosts:
  sub.store: 127.0.0.1
  subs.check: 127.0.0.1
  # > Encrypted DNS
  dns.google: 8.8.8.8
  dns64.dns.google: 2001:4860:4860::6464
  cloudflare-dns.com: 104.16.249.249
  1dot1dot1dot1.cloudflare-dns.com: 1.1.1.1
  one.one.one.one: 1.1.1.1
  dns.alidns.com: 223.5.5.5
  doh.pub: 1.12.12.12
  dot.pub: 1.12.12.12
  doh.360.cn: 23.6.48.18
  dot.360.cn: 101.198.198.198
  dns.twnic.tw: 101.101.101.101
  ordns.he.net: 74.82.42.42

### 全局配置
profile:
  # 存储 select 选择记录
  store-selected: true
  # 持久化 fake-ip
  store-fake-ip: true

# Tun 配置
tun:
  enable: false
  stack: system # gvisor/mixed
  dns-hijack:
    - 0.0.0.0:53 # 需要劫持的 DNS

  # auto-detect-interface: true # 自动识别出口网卡
  # auto-route: true # 配置路由表
  # mtu: 9000 # 最大传输单元
  # gso: false # 启用通用分段卸载，仅支持 Linux
  # gso-max-size: 65536 # 通用分段卸载包的最大大小
  auto-redirect: false # 自动配置 iptables 以重定向 TCP 连接。仅支持 Linux。带有 auto-redirect 的 auto-route 现在可以在路由器上按预期工作，无需干预。
  # strict-route: true # 将所有连接路由到 tun 来防止泄漏，但你的设备将无法其他设备被访问

  # disable-icmp-forwarding: true # 禁用 ICMP 转发，防止某些情况下的 ICMP 环回问题，ping 将不会显示真实的延迟
  route-address-set: # 将指定规则集中的目标 IP CIDR 规则添加到防火墙, 不匹配的流量将绕过路由, 仅支持 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已启用。
    - google_ip
  route-exclude-address-set: # 将指定规则集中的目标 IP CIDR 规则添加到防火墙, 匹配的流量将绕过路由, 仅支持 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已启用。
    - lan
    - private
    - cn_ip
  route-address: # 启用 auto-route 时使用自定义路由而不是默认路由
    - 0.0.0.0/1
    - 128.0.0.0/1
    - '::/1'
    - '8000::/1'

# Android 用户和应用规则仅在 Android 下被支持
# 并且需要 auto-route
# include-android-user: # 限制被路由的 Android 用户
# - 0
# - 10
# include-package: # 限制被路由的 Android 应用包名
# - com.android.chrome
# exclude-package: # 排除被路由的 Android 应用包名
# - com.android.captiveportallogin
# 嗅探域名 可选配置
sniffer:
  enable: true
  ## 对 redir-host 类型识别的流量进行强制嗅探
  ## 如：Tun、Redir 和 TProxy 并 DNS 为 redir-host 皆属于
  # force-dns-mapping: false
  ## 对所有未获取到域名的流量进行强制嗅探
  # parse-pure-ip: false
  # 是否使用嗅探结果作为实际访问，默认 true
  # 全局配置，优先级低于 sniffer.sniff 实际配置
  override-destination: false
  sniff: # TLS 和 QUIC 默认如果不配置 ports 默认嗅探 443
    QUIC:
    #  ports: [ 443 ]
    TLS:
    #  ports: [443, 8443]
    # 默认嗅探 80
    HTTP: # 需要嗅探的端口
      ports:
        - 80
        - 8080-8880
      # 可覆盖 sniffer.override-destination
      override-destination: true
  force-domain:
    - +.v2ex.com

  # skip-src-address: # 对于来源ip跳过嗅探
  #   - 192.168.0.3/32
  # skip-dst-address: # 对于目标ip跳过嗅探
  #   - 192.168.0.3/32
  ## 对嗅探结果进行跳过
  # skip-domain:
  #   - Mijia Cloud
  # 仅对白名单中的端口进行嗅探，默认为 443，80
  # 已废弃，若 sniffer.sniff 配置则此项无效
  port-whitelist:
    - '80'
    - '443'
    # - 8000-9999

ntp:
  enable: false
  server: 'time.apple.com'
  port: 123
  interval: 30
  dialer-proxy: ''
  write-to-system: false

# dns 设置
dns:
  enable: true

  # lru: Least Recently Used, 默认值
  # arc: Adaptive Replacement Cache # 自适应替换缓存
  cache-algorithm: arc
  listen: '0.0.0.0:1053'
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.local'
    - '*.lan'
    - '*.localdomain'
    - '*.home.arpa'
    - '*.test'
    - '*.invalid'
    - '*.example'
    - 'localhost.ptlogin2.qq.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.push.apple.com'
    - '+.miwifi.com'
    - '+.market.xiaomi.com'
    - 'geosite:cn'
    - 'geosite:private'

  # 部分客户端，比如 clash party 还不支持
  # fake-ip-filter-mode: rule
  # fake-ip-filter:
  #   # 1. 本地域名不 fake-ip
  #   - DOMAIN-SUFFIX,local,real-ip
  #   - DOMAIN-SUFFIX,lan,real-ip
  #   - DOMAIN-SUFFIX,localdomain,real-ip
  #   - DOMAIN-SUFFIX,home.arpa,real-ip
  #   - DOMAIN-SUFFIX,test,real-ip
  #   - DOMAIN-SUFFIX,invalid,real-ip
  #   - DOMAIN-SUFFIX,example,real-ip
  #   # 2. 特定域名
  #   - DOMAIN,localhost.ptlogin2.qq.com,real-ip
  #   - DOMAIN-SUFFIX,push.apple.com,real-ip
  #   - DOMAIN-SUFFIX,miwifi.com,real-ip
  #   - DOMAIN-SUFFIX,market.xiaomi.com,real-ip
  #   - DOMAIN-KEYWORD,time,real-ip
  #   - DOMAIN-KEYWORD,ntp,real-ip
  #   # 3. 引入规则集
  #   - RULE-SET,cn_domain,real-ip
  #   - RULE-SET,private,real-ip
  #   - RULE-SET,geolocation-!cn,fake-ip
  #   # 4. 自定义的规则
  #   - DOMAIN,www.baidu.com,real-ip
  #   - DOMAIN-SUFFIX,qq.com,real-ip
  #   - DOMAIN-SUFFIX,jd.com,real-ip
  #   # 5. 默认行为
  #   - MATCH,fake-ip
  prefer-h3: true
  dns-hijack:
    - any:53
    - tcp://any:53

  # 用于解析 nameserver，fallback 以及其他 DNS 服务器配置的，DNS 服务域名
  # 只能使用纯 IP 地址，可使用加密 DNS
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system # append DNS server from system configuration. If not found, it would print an error log and skip.
  nameserver-policy:
    +.local: system

