# 节点检测
# 自动检测分组
AUTO = url-test, select=0, interval=700, tolerance=100, timeout=5, url=https://cp.cloudflare.com/generate_204, policy-regex-filter=^((?!(GiB|cn|中国|⁻|ru|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|(?i)加入|更多)).)*$

